const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
async function attempt(pw, fromSaved) {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const html = await unlock(pw);
    if (document.getElementById("remember").checked) localStorage.setItem("wis_pw", pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (fromSaved) localStorage.removeItem("wis_pw");
    else err.textContent = "That password is not right. Please try again.";
    btn.disabled = false;
  }
}
document.getElementById("go").onclick = () => attempt(document.getElementById("pw").value, false);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") attempt(e.target.value, false); });
const saved = localStorage.getItem("wis_pw");
if (saved) attempt(saved, true); else document.getElementById("pw").focus();
